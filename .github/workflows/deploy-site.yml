# Push-to-deploy for the static site (D19): any push to main that touches web/dist/ redeploys the
# Cloudflare Pages project through infra/cf_site.py's direct-upload client (the same path the
# guarded local scripts use; wrangler is deliberately not used). Until the two repository secrets
# exist the job no-ops with a notice instead of failing.
name: deploy-site
on:
  push:
    branches: [main]
    paths: ["web/dist/**", "infra/cf_site.py", ".github/workflows/deploy-site.yml"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: gate
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$T" ] || [ -z "$A" ]; then
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets not set - skipping deploy."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"
      - name: Deploy web/dist via the Pages direct-upload API
        if: steps.gate.outputs.go == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pip install -q blake3
          python infra/cf_site.py deploy
